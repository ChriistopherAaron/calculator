<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    
</head>
<body>
    
    <div class="calculator">

        <div class="calculator">

            <!--Display Screen-->
            <duv class="calculator-display">0</div>
            <!--Keypad Area-->

            <div class="calculator-keys">
                <!-- Row 1 -->
                 <button class="btn btn-clear" data-action="clear">AC</button>
                 <button class="btn btn-operator" data-action="backspace">&#8592;</button>
                 <button class="btn btn-operator" data-action="percent">%</button>
                 <button class="btn btn-operator" data-action="divide">&#247;</button>

                 <!-- Row 2 -->
                  <button class="btn">7</button>
                  <button class="btn">8</button>
                  <button class="btn">9</button>
                  <button class="btn btn-operaator" data-action="multiply">x</button>
            </div>

                <!-- Row 3 -->

                <button class="btn">4</button>
                <button class="btn">5</button>
                <button class="btn">6</button>
                <button class="btn btn-operator" data-action="subtract">-</button>

                <!-- Row 4 -->
                 <button class="btn">1</button>
                 <button class="btn">2</button>
                 <button class="btn">3</button>
                 <button class="btn btn-operator" data-action="add">+</button>

                 <!-- Row 5 -->
                <button class="btn">0</button>
                <button class="btn btn-operator" data-action="decimal">.</button>
                <button class="btn btn-operator" data-action="calculate">=</button>
    </div>
</div>
        <script src="script.js"></script>
</body>
</html>
